#!/bin/bash

# Script de Configuração DHCP Server
# ISC DHCP Server (Debian/Ubuntu)
# Data: 15/09/2024

# Arquivo: /etc/dhcp/dhcpd.conf

# Opções globais
default-lease-time 172800;      # 2 dias
max-lease-time 604800;          # 7 dias
ddns-update-style none;
authoritative;

# DNS servers
option domain-name "corp.local";
option domain-name-servers 192.168.30.51;
option ntp-servers 192.168.30.51;

# ============================================
# SUBNET VLAN 10 - Administrativo
# ============================================

subnet 192.168.10.0 netmask 255.255.255.0 {
  range 192.168.10.100 192.168.10.200;
  option routers 192.168.10.2;
  option subnet-mask 255.255.255.0;
  option broadcast-address 192.168.10.255;
  option domain-name "corp.local";
  option domain-name-servers 192.168.30.51;
  
  # Configurações específicas para Admin
  option time-offset -3;
  
  # Reservas (IPs fixos para equipamentos críticos)
  host admin-workstation-01 {
    hardware ethernet 00:11:22:33:44:01;
    fixed-address 192.168.10.50;
  }
  
  host admin-printer {
    hardware ethernet 00:11:22:33:44:02;
    fixed-address 192.168.10.51;
  }
}

# ============================================
# SUBNET VLAN 20 - TI
# ============================================

subnet 192.168.20.0 netmask 255.255.255.0 {
  range 192.168.20.100 192.168.20.200;
  option routers 192.168.20.2;
  option subnet-mask 255.255.255.0;
  option broadcast-address 192.168.20.255;
  option domain-name "corp.local";
  option domain-name-servers 192.168.30.51;
  
  # Reservas para equipamentos TI
  host ti-workstation-01 {
    hardware ethernet 00:11:22:33:44:11;
    fixed-address 192.168.20.50;
  }
  
  host ti-workstation-02 {
    hardware ethernet 00:11:22:33:44:12;
    fixed-address 192.168.20.51;
  }
}

# ============================================
# SUBNET VLAN 30 - Servidores
# ============================================

subnet 192.168.30.0 netmask 255.255.255.0 {
  range 192.168.30.100 192.168.30.200;
  option routers 192.168.30.2;
  option subnet-mask 255.255.255.0;
  option broadcast-address 192.168.30.255;
  option domain-name "corp.local";
  option domain-name-servers 192.168.30.51;
  
  # Servidores (IPs fixos)
  host dhcp-server {
    hardware ethernet 00:11:22:33:44:21;
    fixed-address 192.168.30.50;
  }
  
  host dns-server {
    hardware ethernet 00:11:22:33:44:22;
    fixed-address 192.168.30.51;
  }
  
  host web-server-01 {
    hardware ethernet 00:11:22:33:44:23;
    fixed-address 192.168.30.60;
  }
  
  host database-server-01 {
    hardware ethernet 00:11:22:33:44:24;
    fixed-address 192.168.30.70;
  }
}

# ============================================
# CLASS - Configurações por classe de clientes
# ============================================

class "printers" {
  match hardware;
}

class "administrativo" {
  match hardware;
}

# ============================================
# LOGGING
# ============================================

log-facility local7;
