#!/bin/bash

# Script de Configuração DNS Server
# BIND 9 (Debian/Ubuntu)
# Data: 15/09/2024

# Arquivo: /etc/bind/named.conf.local

zone "corp.local" {
    type master;
    file "/etc/bind/zones/db.corp.local";
};

zone "30.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.192.168.30";
};

zone "20.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.192.168.20";
};

zone "10.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/db.192.168.10";
};

---

# Arquivo: /etc/bind/zones/db.corp.local

$TTL    604800
@       IN      SOA     dns.corp.local. admin.corp.local. (
                        2024090101      ; Serial
                        604800          ; Refresh (7 dias)
                        86400           ; Retry (1 dia)
                        2419200         ; Expire (28 dias)
                        604800 )        ; Minimum (7 dias)
        IN      NS      dns.corp.local.

; Servidores de nomes
dns     IN      A       192.168.30.51

; Gateways de VLAN
gw-admin    IN      A       192.168.10.2
gw-ti       IN      A       192.168.20.2
gw-servidores IN    A       192.168.30.2
gw-mgmt     IN      A       192.168.90.2

; Switch Core
switch-core IN      A       192.168.10.1

; Router Core
router-core IN      A       192.168.10.254

; Servidores
dhcp-server   IN    A       192.168.30.50
dns-server    IN    A       192.168.30.51
web-server-01 IN    A       192.168.30.60
db-server-01  IN    A       192.168.30.70

; Aliases
www         IN      CNAME   web-server-01.corp.local.
mail        IN      CNAME   web-server-01.corp.local.
db          IN      CNAME   db-server-01.corp.local.

---

# Arquivo: /etc/bind/zones/db.192.168.30

$TTL    604800
@       IN      SOA     dns.corp.local. admin.corp.local. (
                        2024090101
                        604800
                        86400
                        2419200
                        604800 )
        IN      NS      dns.corp.local.

; Reverse DNS para VLAN 30 (Servidores)
50      IN      PTR     dhcp-server.corp.local.
51      IN      PTR     dns-server.corp.local.
60      IN      PTR     web-server-01.corp.local.
70      IN      PTR     db-server-01.corp.local.

---

# Arquivo: /etc/bind/zones/db.192.168.20

$TTL    604800
@       IN      SOA     dns.corp.local. admin.corp.local. (
                        2024090101
                        604800
                        86400
                        2419200
                        604800 )
        IN      NS      dns.corp.local.

; Reverse DNS para VLAN 20 (TI)
2       IN      PTR     gw-ti.corp.local.
50      IN      PTR     ti-workstation-01.corp.local.
51      IN      PTR     ti-workstation-02.corp.local.

---

# Arquivo: /etc/bind/zones/db.192.168.10

$TTL    604800
@       IN      SOA     dns.corp.local. admin.corp.local. (
                        2024090101
                        604800
                        86400
                        2419200
                        604800 )
        IN      NS      dns.corp.local.

; Reverse DNS para VLAN 10 (Admin)
2       IN      PTR     gw-admin.corp.local.
50      IN      PTR     admin-workstation-01.corp.local.
51      IN      PTR     admin-printer.corp.local.

---

# Comandos para validar configuração

# Checar sintaxe do arquivo principal
named-checkconf /etc/bind/named.conf

# Checar sintaxe da zona
named-checkzone corp.local /etc/bind/zones/db.corp.local

# Iniciar serviço
systemctl start bind9
systemctl enable bind9

# Ver status
systemctl status bind9

# Testar resolução
nslookup www.corp.local 192.168.30.51
dig www.corp.local @192.168.30.51
