#!/bin/bash

# Script de Configuração - Firewall
# Palo Alto Networks (ou similar)
# Data: 15/09/2024

configure

# ============================================
# ZONAS DE SEGURANÇA
# ============================================

set zone INTERNET type external
set zone INTERNET description "Internet - Zona Externa"

set zone CORPORATIVO type internal
set zone CORPORATIVO description "Rede Corporativa Interna"

# ============================================
# INTERFACES
# ============================================

set deviceconfig system hostname Firewall-Corp
set deviceconfig system dns-setting servers primary 192.168.30.51

# Interface Externa (Internet)
set network interface ethernet ethernet1/1 layer3 units ethernet1/1.1 ip 200.1.1.1/24

# Interface Interna (Rede Corporativa)
set network interface ethernet ethernet1/2 layer3 units ethernet1/2.1 ip 192.168.0.1/16

# ============================================
# ZONAS EM INTERFACES
# ============================================

set zone INTERNET network layer3 ethernet1/1.1
set zone CORPORATIVO network layer3 ethernet1/2.1

# ============================================
# POLÍTICAS DE SEGURANÇA
# ============================================

# Política 1: Permitir tráfego interno para internet (com NAT)
add security rules rule-allow-internal-to-internet 
set security rules rule-allow-internal-to-internet from CORPORATIVO
set security rules rule-allow-internal-to-internet to INTERNET
set security rules rule-allow-internal-to-internet source any
set security rules rule-allow-internal-to-internet destination any
set security rules rule-allow-internal-to-internet action allow
set security rules rule-allow-internal-to-internet application any
set security rules rule-allow-internal-to-internet service application-default

# Política 2: Bloquear Admin → TI (VLAN 10 → VLAN 20)
add security rules rule-block-admin-to-ti
set security rules rule-block-admin-to-ti from CORPORATIVO
set security rules rule-block-admin-to-ti to CORPORATIVO
set security rules rule-block-admin-to-ti source 192.168.10.0/24
set security rules rule-block-admin-to-ti destination 192.168.20.0/24
set security rules rule-block-admin-to-ti action deny
set security rules rule-block-admin-to-ti log-start yes
set security rules rule-block-admin-to-ti log-end yes

# Política 3: Permitir TI → Servidores (VLAN 20 → VLAN 30)
add security rules rule-allow-ti-to-servers
set security rules rule-allow-ti-to-servers from CORPORATIVO
set security rules rule-allow-ti-to-servers to CORPORATIVO
set security rules rule-allow-ti-to-servers source 192.168.20.0/24
set security rules rule-allow-ti-to-servers destination 192.168.30.0/24
set security rules rule-allow-ti-to-servers action allow
set security rules rule-allow-ti-to-servers application ssh https mysql
set security rules rule-allow-ti-to-servers service application-default

# Política 4: Permitir Servidores → Internet (para atualizações)
add security rules rule-allow-servers-to-internet
set security rules rule-allow-servers-to-internet from CORPORATIVO
set security rules rule-allow-servers-to-internet to INTERNET
set security rules rule-allow-servers-to-internet source 192.168.30.0/24
set security rules rule-allow-servers-to-internet destination any
set security rules rule-allow-servers-to-internet action allow
set security rules rule-allow-servers-to-internet application http https dns
set security rules rule-allow-servers-to-internet service application-default

# Política 5: Bloquear tudo mais (padrão)
add security rules rule-deny-all-default
set security rules rule-deny-all-default from any
set security rules rule-deny-all-default to any
set security rules rule-deny-all-default source any
set security rules rule-deny-all-default destination any
set security rules rule-deny-all-default action deny
set security rules rule-deny-all-default log-end yes

# ============================================
# NAT (Network Address Translation)
# ============================================

add network nat rules-2 nat-internal-to-internet
set network nat rules-2 nat-internal-to-internet from CORPORATIVO
set network nat rules-2 nat-internal-to-internet to INTERNET
set network nat rules-2 nat-internal-to-internet source 192.168.0.0/16
set network nat rules-2 nat-internal-to-internet destination any
set network nat rules-2 nat-internal-to-internet service any
set network nat rules-2 nat-internal-to-internet dynamic-destination-translate translated-address 200.1.1.1

# ============================================
# LOGGING E MONITORAMENTO
# ============================================

set deviceconfig system syslog server syslog-server ip-address 192.168.30.51
set deviceconfig system syslog server syslog-server facility LOG_LOCAL7
set deviceconfig system syslog server syslog-server transport UDP
set deviceconfig system syslog server syslog-server port 514

# ============================================
# COMMIT
# ============================================

commit

# ============================================
# Verificação
# ============================================

show security rules
show network nat rules
show zone
